name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes the run in flight; no point paying for stale results.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Validation is skipped: CI needs no real secrets to type-check and lint.
  SKIP_ENV_VALIDATION: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Generated types must exist before tsc runs.
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
          AUTH_SECRET: ci-placeholder-secret-at-least-32-characters
          NEXT_PUBLIC_SITE_URL: https://example.com

  migrations:
    name: Migration check
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migrations_check
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Proves the committed migrations apply cleanly to an empty database and
      # that no one has edited the schema without generating a migration.
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migrations_check

      - run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url postgresql://postgres:postgres@localhost:5432/migrations_check --exit-code
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migrations_check
        continue-on-error: false
